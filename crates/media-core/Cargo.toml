[package]
name = "media-core"
description = "Platform-agnostic kernel of media-cli: models, HTTP, sessions, output and the shared command set"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Import login cookies from local browsers (`login --browser`).
browser = ["dep:rookie"]

[dependencies]
clap.workspace = true
comfy-table = "8"
dirs = "6"
futures-util = "0.3"
html2text = "0.17"
indicatif = "0.18"
jiff.workspace = true
owo-colors = { version = "4", features = ["supports-colors"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand.workspace = true
rookie = { version = "0.5", optional = true }
serde.workspace = true
serde-saphyr = "1"
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url.workspace = true
wreq = { version = "6.0.0-rc.31", features = ["json", "form", "query", "multipart", "stream", "cookies", "gzip", "brotli", "deflate", "zstd", "socks"] }
wreq-util = "3.0.0-rc.14"
